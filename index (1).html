<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동네 스터디 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#5b4030;
    --board-dark:#4a3427;
    --paper:#faf3e2;
    --paper-shadow:#e8dcc0;
    --ink:#2b2118;
    --ink-soft:#6b5c4a;
    --pin-red:#c1443d;
    --pin-teal:#2f7b6d;
    --pin-mustard:#d9a73b;
    --pin-blue:#3d6fa8;
    --pin-purple:#7a5ba8;
    --pin-gray:#7d7266;
    --pin-green:#5a8f4f;
    --thread:#c9b892;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    background-color:var(--board);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.08) 0, transparent 40%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 4px);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--pin-mustard);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- header ---------- */
  .board-header{
    padding:36px 20px 20px;
    text-align:center;
    position:relative;
  }
  .board-title{
    font-family:'Gaegu', cursive;
    font-size:44px;
    font-weight:700;
    color:#f6ecd8;
    margin:0;
    text-shadow:0 2px 0 rgba(0,0,0,0.25);
    letter-spacing:1px;
  }
  .board-sub{
    color:#d8c9ab;
    font-size:14px;
    margin-top:6px;
  }
  .region-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:16px;
    background:rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.15);
    color:#f6ecd8;
    padding:8px 16px;
    border-radius:999px;
    font-size:14px;
    cursor:pointer;
    transition:background 0.15s;
  }
  .region-pill:hover{background:rgba(0,0,0,0.32);}
  .region-pill b{font-weight:700; color:#fff;}

  /* ---------- board / corkboard grid ---------- */
  .board-wrap{
    max-width:1100px;
    margin:0 auto;
    padding:10px 24px 120px;
  }
  .flyer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:34px 26px;
    padding-top:20px;
  }
  .grade-filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding-top:22px;
  }
  .grade-chip{
    border:1.5px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.18);
    color:#f0e6cf;
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
  }
  .grade-chip:hover{ background:rgba(0,0,0,0.3); }
  .grade-chip.selected{
    background:var(--pin-mustard);
    border-color:var(--pin-mustard);
    color:var(--ink);
    font-weight:700;
  }

  .flyer{
    position:relative;
    background:var(--paper);
    padding:26px 20px 20px;
    box-shadow:0 10px 18px rgba(0,0,0,0.28), 0 2px 0 rgba(0,0,0,0.1);
    min-height:220px;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transform:rotate(var(--tilt, -1deg));
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    background-image:
      linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px);
    background-size:100% 26px;
  }
  .flyer:nth-child(3n){ --tilt: 1.4deg; }
  .flyer:nth-child(3n+1){ --tilt: -1.6deg; }
  .flyer:nth-child(3n+2){ --tilt: 0.6deg; }
  .flyer:hover{
    transform:rotate(0deg) translateY(-4px) scale(1.02);
    box-shadow:0 16px 26px rgba(0,0,0,0.35);
    z-index:5;
  }
  .pin{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    box-shadow:0 3px 4px rgba(0,0,0,0.4), inset -2px -2px 3px rgba(0,0,0,0.25), inset 2px 2px 3px rgba(255,255,255,0.4);
  }
  .cat-국어 .pin{ background:var(--pin-red); }
  .cat-영어 .pin{ background:var(--pin-blue); }
  .cat-수학 .pin{ background:var(--pin-purple); }
  .cat-사회 .pin{ background:var(--pin-mustard); }
  .cat-과학 .pin{ background:var(--pin-teal); }
  .cat-코딩 .pin{ background:var(--pin-green); }
  .cat-기타 .pin{ background:var(--pin-gray); }

  .flyer-badges{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:10px;
  }
  .flyer-cat{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:3px 9px;
    border-radius:3px;
    display:inline-block;
    color:#fff;
  }
  .cat-국어 .flyer-cat{ background:var(--pin-red); }
  .cat-영어 .flyer-cat{ background:var(--pin-blue); }
  .cat-수학 .flyer-cat{ background:var(--pin-purple); }
  .cat-사회 .flyer-cat{ background:var(--pin-mustard); }
  .cat-과학 .flyer-cat{ background:var(--pin-teal); }
  .cat-코딩 .flyer-cat{ background:var(--pin-green); }
  .cat-기타 .flyer-cat{ background:var(--pin-gray); }

  .flyer-grade{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:2.5px 8px;
    border-radius:3px;
    display:inline-block;
    color:var(--ink);
    background:transparent;
    border:1.5px solid var(--ink);
  }

  .flyer-title{
    font-family:'Gaegu', cursive;
    font-size:24px;
    font-weight:700;
    margin:0 0 8px;
    line-height:1.25;
    word-break:keep-all;
  }
  .flyer-meta{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
    display:flex;
    gap:6px;
  }
  .flyer-meta b{color:var(--ink); font-weight:700;}
  .flyer-meta.full{ color:var(--pin-red); font-weight:700; }
  .flyer-desc{
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
    margin-top:10px;
    flex:1;
    word-break:keep-all;
    white-space:pre-wrap;
  }
  .flyer-footer{
    margin-top:14px;
    padding-top:10px;
    border-top:1px dashed var(--paper-shadow);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--ink-soft);
  }
  .flyer-delete{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:12px;
    text-decoration:underline;
    padding:2px;
  }
  .flyer-delete:hover{color:var(--pin-red);}

  /* ---------- empty state ---------- */
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:#f0e6cf;
  }
  .empty-state .big{
    font-family:'Gaegu', cursive;
    font-size:28px;
    margin-bottom:8px;
  }
  .empty-state .small{
    font-size:14px;
    color:#cbb98f;
  }

  /* ---------- floating add button ---------- */
  .fab{
    position:fixed;
    right:26px;
    bottom:26px;
    background:var(--pin-red);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:16px 22px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    gap:8px;
    transition:transform 0.15s, box-shadow 0.15s;
    z-index:20;
  }
  .fab:hover{ transform:translateY(-3px); box-shadow:0 12px 22px rgba(0,0,0,0.45); }

  /* ---------- modal shared ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,14,8,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-card{
    background:var(--paper);
    max-width:440px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:30px 26px 26px;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .modal-card .pin{ top:-12px; }
  .modal-title{
    font-family:'Gaegu', cursive;
    font-size:26px;
    font-weight:700;
    margin:6px 0 18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field label .req{
    color:var(--pin-red);
    margin-left:2px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1.5px solid var(--paper-shadow);
    background:#fff;
    padding:9px 11px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    border-radius:4px;
    transition:border-color 0.15s, background 0.15s;
  }
  .field input.invalid, .field select.invalid, .field textarea.invalid{
    border-color:var(--pin-red);
    background:#fff5f4;
  }
  .field-error-msg{
    font-size:11.5px;
    color:var(--pin-red);
    margin-top:4px;
  }
  .field textarea{ resize:vertical; min-height:72px; }
  .field-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .field-row .field{ flex:1; min-width:88px; }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn-primary, .btn-secondary{
    flex:1;
    border:none;
    padding:12px;
    border-radius:5px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{ background:var(--pin-red); color:#fff; }
  .btn-primary:hover{ background:#a8362f; }
  .btn-primary:disabled{ background:#c9b3a8; cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--paper-shadow); }
  .btn-secondary:hover{ background:rgba(0,0,0,0.04); }
  .field-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .close-x{
    position:absolute;
    top:12px;
    right:14px;
    background:none;
    border:none;
    font-size:20px;
    color:var(--ink-soft);
    cursor:pointer;
    line-height:1;
  }

  .region-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:10px;
  }

  /* ---------- detail modal ---------- */
  .detail-section{ margin-bottom:16px; }
  .detail-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .detail-meta-line{
    font-size:14px;
    color:var(--ink);
    margin-bottom:6px;
    display:flex;
    gap:6px;
  }
  .detail-desc{
    font-size:14px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:keep-all;
  }
  .progress-track{
    background:var(--paper-shadow);
    border-radius:999px;
    height:10px;
    overflow:hidden;
    margin:6px 0 4px;
  }
  .progress-fill{
    height:100%;
    background:var(--pin-teal);
    border-radius:999px;
    transition:width 0.2s ease;
  }
  .progress-fill.full{ background:var(--pin-red); }
  .progress-label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .progress-label.full{ color:var(--pin-red); font-weight:700; }
  .participant-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
  }
  .participant-chip{
    background:#fff;
    border:1.5px solid var(--paper-shadow);
    border-radius:999px;
    padding:5px 12px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .participant-chip:hover{ border-color:var(--pin-red); color:var(--pin-red); }
  .participant-empty{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .join-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .join-row input{
    flex:1;
    border:1.5px solid var(--paper-shadow);
    border-radius:4px;
    padding:9px 11px;
    font-size:14px;
    font-family:inherit;
  }
  .join-row button{
    border:none;
    background:var(--pin-teal);
    color:#fff;
    padding:0 18px;
    border-radius:4px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .join-row button:disabled{
    background:#b9b0a1;
    cursor:not-allowed;
  }
  .detail-divider{
    border:none;
    border-top:1px dashed var(--paper-shadow);
    margin:18px 0;
  }
  .detail-host{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .region-btn{
    border:1.5px solid var(--paper-shadow);
    background:#fff;
    padding:10px 6px;
    border-radius:5px;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .region-btn:hover{ border-color:var(--pin-red); color:var(--pin-red); }
  .region-btn.selected{ background:var(--pin-red); border-color:var(--pin-red); color:#fff; }

  .loading-row{
    text-align:center;
    color:#d8c9ab;
    padding:50px 0;
    font-size:14px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:96px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-size:13px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s, bottom 0.2s;
  }
  .toast.show{ opacity:1; bottom:106px; }

  @media (max-width:520px){
    .board-title{ font-size:32px; }
    .board-wrap{ padding:0 14px 120px; }
    .region-grid{ grid-template-columns:repeat(2, 1fr); }
    .field-row{ flex-direction:column; gap:0; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  // ---------- Supabase setup ----------
  // Project URL must be the bare project origin (no /rest/v1 suffix) —
  // supabase-js appends the right paths itself.
  var SUPABASE_URL = 'https://ijbfiavositewwysnfrx.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_6j7VSJ3FRIpS1y-ZT3Q95Q_QrqzjPKv';
  var sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  var CATS = ["국어","영어","수학","사회","과학","코딩","기타"];
  var GRADES = ["중1","중2","중3","고1","고2","고3","학년무관"];
  var REGIONS = ["서울","경기","인천","부산","대구","광주","대전","울산","세종",
                  "강원","충북","충남","전북","전남","경북","경남","제주"];

  var state = {
    myRegion: null,
    posts: [],
    loading: true,
    showCreate: false,
    showRegionPicker: false,
    showDetail: false,
    detailPostId: null,
    gradeFilter: '전체',
    error: null
  };

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function catClass(cat){
    return CATS.indexOf(cat) >= 0 ? 'cat-' + cat : 'cat-기타';
  }

  // ---------- resilient storage layer ----------
  // Tries window.storage first (Claude artifact persistence, shared across
  // everyone who opens the artifact). If that's unavailable — e.g. this file
  // deployed on its own static host — it falls back to the browser's
  // localStorage, so data survives reloads on that same browser/device.
  // If even localStorage is blocked (e.g. private browsing), it falls back
  // to an in-memory store for just this page load.
  var LS_PREFIX = 'studyboard:';
  var memoryStore = { personal:{}, shared:{} };
  var persistWarned = false;

  function warnNoPersist(usingLocalStorage){
    if(!persistWarned){
      persistWarned = true;
      showToast(usingLocalStorage
        ? '이 브라우저에만 저장돼요. 다른 사람과는 공유되지 않아요.'
        : '저장소에 연결할 수 없어 이 화면에서만 임시로 동작해요.');
    }
  }

  function lsAvailable(){
    try{
      var t = '__ls_test__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return true;
    }catch(e){
      return false;
    }
  }

  async function storageGet(key, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      return await window.storage.get(key, shared);
    }catch(e){
      var nsKey = LS_PREFIX + (shared ? 'shared:' : 'personal:') + key;
      if(lsAvailable()){
        var lsVal = window.localStorage.getItem(nsKey);
        if(lsVal !== null){
          return { key: key, value: lsVal, shared: shared };
        }
      }
      var store = shared ? memoryStore.shared : memoryStore.personal;
      if(Object.prototype.hasOwnProperty.call(store, key)){
        return { key: key, value: store[key], shared: shared };
      }
      throw e;
    }
  }

  async function storageSet(key, value, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      var r = await window.storage.set(key, value, shared);
      if(!r) throw new Error('empty result from storage.set');
      return r;
    }catch(e){
      console.error('storage.set falling back:', e);
      var nsKey = LS_PREFIX + (shared ? 'shared:' : 'personal:') + key;
      if(lsAvailable()){
        try{
          window.localStorage.setItem(nsKey, value);
          warnNoPersist(true);
          return { key: key, value: value, shared: shared };
        }catch(lsErr){ /* fall through to memory */ }
      }
      warnNoPersist(false);
      var store = shared ? memoryStore.shared : memoryStore.personal;
      store[key] = value;
      return { key: key, value: value, shared: shared };
    }
  }

  async function storageDelete(key, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      return await window.storage.delete(key, shared);
    }catch(e){
      var nsKey = LS_PREFIX + (shared ? 'shared:' : 'personal:') + key;
      if(lsAvailable()){
        window.localStorage.removeItem(nsKey);
      }
      var store = shared ? memoryStore.shared : memoryStore.personal;
      delete store[key];
      return { key: key, deleted: true, shared: shared };
    }
  }

  async function storageList(prefix, shared){
    try{
      if(!window.storage) throw new Error('storage unavailable');
      return await window.storage.list(prefix, shared);
    }catch(e){
      var nsPrefix = LS_PREFIX + (shared ? 'shared:' : 'personal:') + (prefix || '');
      var keys = [];
      if(lsAvailable()){
        for(var i=0;i<window.localStorage.length;i++){
          var fullKey = window.localStorage.key(i);
          if(fullKey && fullKey.indexOf(nsPrefix) === 0){
            keys.push(fullKey.slice(LS_PREFIX.length + (shared ? 7 : 9)));
          }
        }
      }
      var store = shared ? memoryStore.shared : memoryStore.personal;
      Object.keys(store).forEach(function(k){
        if((!prefix || k.indexOf(prefix) === 0) && keys.indexOf(k) === -1){
          keys.push(k);
        }
      });
      return { keys: keys, prefix: prefix, shared: shared };
    }
  }

  async function loadMyRegion(){
    try{
      var res = await storageGet('my-region', false);
      state.myRegion = res ? res.value : null;
    }catch(e){
      state.myRegion = null;
    }
  }

  async function loadPosts(){
    state.loading = true;
    render();
    try{
      if(!sb) throw new Error('supabase client not initialized');
      var res = await sb.from('posts').select('*, participants(*)').order('created_at', { ascending: false });
      if(res.error) throw res.error;
      state.posts = res.data || [];
      state.error = null;
    }catch(e){
      console.error('loadPosts error:', e);
      state.error = '게시글을 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
    }
    state.loading = false;
    render();
  }

  async function setMyRegion(region){
    await storageSet('my-region', region, false);
    state.myRegion = region;
    state.showRegionPicker = false;
    render();
  }

  async function createPost(data){
    if(!sb){ showToast('데이터베이스에 연결할 수 없어요.'); return false; }
    var payload = {
      title: data.title,
      category: data.category,
      grade: data.grade,
      region: state.myRegion,
      schedule: data.schedule,
      capacity: data.capacity,
      contact: data.contact,
      nickname: data.nickname,
      description: data.description
    };
    var res = await sb.from('posts').insert([payload]).select();
    if(res.error || !res.data || !res.data.length){
      console.error('createPost error:', res.error);
      showToast('등록에 실패했어요. 다시 시도해주세요.');
      return false;
    }
    var newPost = res.data[0];
    newPost.participants = [];
    state.posts.unshift(newPost);
    state.showCreate = false;
    render();
    showToast('스터디가 게시판에 붙었어요 📌');
    return true;
  }

  async function deletePost(post){
    var typed = prompt('삭제하려면 작성 시 입력한 닉네임 "' + post.nickname + '"을(를) 그대로 입력해주세요.');
    if(typed === null) return;
    if(typed !== post.nickname){
      showToast('닉네임이 일치하지 않아요.');
      return;
    }
    if(!sb){ showToast('데이터베이스에 연결할 수 없어요.'); return; }
    var res = await sb.from('posts').delete().eq('id', post.id);
    if(res.error){
      console.error('deletePost error:', res.error);
      showToast('삭제에 실패했어요.');
      return;
    }
    state.posts = state.posts.filter(function(p){ return p.id !== post.id; });
    if(state.detailPostId === post.id){ state.showDetail = false; state.detailPostId = null; }
    render();
    showToast('게시글을 뗐어요.');
  }

  function capacityNum(post){
    var n = parseInt(post.capacity, 10);
    return isNaN(n) ? null : n;
  }

  function joinedCount(post){
    return (post.participants || []).length;
  }

  function remainingSlots(post){
    var cap = capacityNum(post);
    if(cap === null) return null;
    return cap - joinedCount(post);
  }

  function capacityLabel(post){
    var cap = capacityNum(post);
    var joined = joinedCount(post);
    if(cap === null) return joined + '명 참여 · 인원 자유';
    var remain = cap - joined;
    if(remain <= 0) return joined + '/' + cap + '명 · 마감';
    return joined + '/' + cap + '명 · ' + remain + '자리 남음';
  }

  async function joinPost(post, name){
    name = (name || '').trim();
    if(!name){ showToast('이름을 입력해주세요.'); return false; }
    var already = (post.participants || []).some(function(p){ return p.name === name; });
    if(already){ showToast('이미 참여했어요.'); return false; }
    var remain = remainingSlots(post);
    if(remain !== null && remain <= 0){ showToast('정원이 모두 찼어요.'); return false; }
    if(!sb){ showToast('데이터베이스에 연결할 수 없어요.'); return false; }
    var res = await sb.from('participants').insert([{ post_id: post.id, name: name }]).select();
    if(res.error || !res.data || !res.data.length){
      console.error('joinPost error:', res.error);
      showToast('참여에 실패했어요. 다시 시도해주세요.');
      return false;
    }
    post.participants = post.participants || [];
    post.participants.push(res.data[0]);
    render();
    showToast('참여 완료했어요! 🙌');
    return true;
  }

  async function leaveParticipant(post, participant){
    var typed = prompt('참여를 취소하려면 이름 "' + participant.name + '"을(를) 다시 입력해주세요.');
    if(typed === null) return;
    if(typed !== participant.name){
      showToast('이름이 일치하지 않아요.');
      return;
    }
    if(!sb){ showToast('데이터베이스에 연결할 수 없어요.'); return; }
    var res = await sb.from('participants').delete().eq('id', participant.id);
    if(res.error){
      console.error('leaveParticipant error:', res.error);
      showToast('취소에 실패했어요.');
      return;
    }
    post.participants = (post.participants || []).filter(function(p){ return p.id !== participant.id; });
    render();
    showToast('참여를 취소했어요.');
  }

      errRow.textContent = state.error;
      wrap.appendChild(errRow);
    } else {
      var chipRow = document.createElement('div');
      chipRow.className = 'grade-filter-row';
      ['전체'].concat(GRADES.filter(function(g){ return g !== '학년무관'; })).forEach(function(g){
        var chip = document.createElement('button');
        chip.className = 'grade-chip' + (state.gradeFilter === g ? ' selected' : '');
        chip.textContent = g;
        chip.addEventListener('click', function(){ state.gradeFilter = g; render(); });
        chipRow.appendChild(chip);
      });
      wrap.appendChild(chipRow);

      var posts = displayedPosts();
      if(posts.length === 0){
        var empty = document.createElement('div');
        empty.className = 'empty-state';
        var emptyLine = state.gradeFilter === '전체'
          ? '아직 ' + escapeHtml(state.myRegion) + '엔 스터디가 없어요'
          : escapeHtml(state.myRegion) + ' · ' + escapeHtml(state.gradeFilter) + ' 스터디가 아직 없어요';
        empty.innerHTML = '<div class="big">' + emptyLine + '</div>' +
                           '<div class="small">첫 번째 스터디를 올려서 동네 친구들을 모아보세요</div>';
        wrap.appendChild(empty);
      } else {
        var grid = document.createElement('div');
        grid.className = 'flyer-grid';
        posts.forEach(function(p){ grid.appendChild(renderFlyer(p)); });
        wrap.appendChild(grid);
      }
    }

    app.appendChild(wrap);

    // FAB
    if(state.myRegion && !state.loading){
      var fab = document.createElement('button');
      fab.className = 'fab';
      fab.innerHTML = '➕ 스터디 올리기';
      fab.addEventListener('click', function(){ state.showCreate = true; state.showDetail = false; render(); });
      app.appendChild(fab);
    }

    // Modals
    if(!state.myRegion){
      app.appendChild(renderRegionPickerModal(true));
    } else if(state.showRegionPicker){
      app.appendChild(renderRegionPickerModal(false));
    } else if(state.showCreate){
      app.appendChild(renderCreateModal());
    } else if(state.showDetail){
      var detailPost = findPost(state.detailPostId);
      if(detailPost){
        app.appendChild(renderDetailModal(detailPost));
      } else {
        state.showDetail = false;
        state.detailPostId = null;
      }
    }
  }

  async function init(){
    render();
    await loadMyRegion();
    render();
    if(state.myRegion){
      await loadPosts();
    } else {
      state.loading = false;
      render();
    }
  }

  // watch region changes to (re)load posts
  var _setMyRegion = setMyRegion;
  setMyRegion = async function(region){
    await _setMyRegion(region);
    if(state.posts.length === 0){
      await loadPosts();
    }
  };

  init();
})();
</script>
</body>
</html>
